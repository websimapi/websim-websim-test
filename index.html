<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Websim Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1 class="title">Creative Engine Active</h1>
    <div class="orb" id="mainOrb"></div>
    <button class="action-btn" id="activateBtn">🌀 Unleash</button>
  </div>

  <script>
    const orb = document.getElementById('mainOrb');
    const btn = document.getElementById('activateBtn');
    let energyLevel = 0;

    function pulseCreation() {
      energyLevel += 10;
      orb.style.transform = `scale(${1 + energyLevel/100})`;
      
      if(energyLevel < 100) {
        requestAnimationFrame(pulseCreation);
      } else {
        const particles = 25;
        for(let i = 0; i < particles; i++) {
          const particle = document.createElement('div');
          particle.className = 'energy-particle';
          particle.style.left = `${50 + Math.cos((i*15)/180*Math.PI)*40}%`;
          particle.style.top = `${50 + Math.sin((i*15)/180*Math.PI)*40}%`;
          document.body.appendChild(particle);
          
          setTimeout(() => {
            particle.remove();
          }, 1000);
        }
        energyLevel = 0;
        orb.style.transform = 'scale(1)';
      }
    }

    btn.addEventListener('click', () => {
      btn.classList.add('active');
      pulseCreation();
      setTimeout(() => btn.classList.remove('active'), 200);
    });
  </script>
